<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#080812" />
    <title>Offline — Codyza</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 1.5rem; background: radial-gradient(circle at 70% 8%, rgba(48,43,251,.2), transparent 34%), #080812; color: #f7f7fb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; }
      main { width: min(100%, 24rem); }
      img { width: 4.5rem; height: 4.5rem; border-radius: 1.1rem; }
      .eyebrow { margin: 1.5rem 0 0; color: #8b87ff; font: 600 .625rem/1.4 ui-monospace, "SFMono-Regular", monospace; letter-spacing: .2em; text-transform: uppercase; }
      h1 { margin: .7rem 0 0; font-size: 2rem; line-height: 1.05; letter-spacing: -.04em; }
      p:last-of-type { margin: .8rem auto 0; max-width: 20rem; color: rgba(255,255,255,.58); font-size: .9rem; line-height: 1.65; }
      button { min-height: 2.8rem; margin-top: 1.7rem; border: 0; border-radius: 999px; padding: 0 1.5rem; background: #8b87ff; color: #080812; font: inherit; font-size: .875rem; font-weight: 700; cursor: pointer; }
      button:active { transform: scale(.97); }
      @media (prefers-reduced-motion: reduce) { button:active { transform: none; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Codyza" />
      <p class="eyebrow">connection paused</p>
      <h1>You’re offline.</h1>
      <p>Reconnect to open your member workspace and sync new activity.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
